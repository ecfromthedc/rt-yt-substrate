# Data flows between substrate components. Drawn as arrows in HTML/Canvas.
data_flows:
  - from: notion
    to: postgres
    via: rust_sync_adapter
    pattern: SELECT FOR UPDATE
    note: Notion edits webhook → adapter writes → Postgres canonical.
  - from: postgres
    to: notion
    via: rust_sync_adapter
    pattern: mirror-back
    note: Postgres-originated changes mirror back to Notion DBs.
  - from: knowledge_repo
    to: neo4j
    via: neo4j_alexandria_ingest
    pattern: append + embed
    note: New teardowns / winning patterns ingested + vector embedded.
  - from: neo4j
    to: agents
    via: neo4j_http_wrapper
    pattern: read-only HTTP
    note: Strategist queries graph for winning patterns during Stage 02.
  - from: postgres
    to: gap_finder
    via: cron
    pattern: poll Blocked Reason
    note: Daemon mode. Skill mode also exposed for on-demand calls.
  - from: postgres
    to: dashboard
    via: snapshot_view
    pattern: 15min refresh
    note: Per-operator tracking dashboard, side-by-side render.

