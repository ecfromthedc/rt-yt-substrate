# RT YouTube Long-Form Workflow Map
# Single source of truth for the long-form pipeline.
# HTML renderer (docs/workflow-map.html) + Obsidian Canvas mirror render from this file.
#
# EDIT FLOW (any agent — Glitch's, Jay's, Smaths', Eric's):
#   1. Edit this file on a branch
#   2. Open a PR
#   3. CI lints schema + Mermaid build
#   4. Merge → HTML + Canvas auto-regen
#
# Schema version. Bump on breaking changes.
version: 1

# Operators are humans running channels. Each owns gate decisions on their own channels.
operators:
  - id: glitch
    display: Glitch
    color: "#7C5CFF"
    slack_user: U0B5X0TN2G4
  - id: jay
    display: Jay
    color: "#00C6A2"
    slack_user: U0B2CBM8Z6E

# Agent roles are the AI lanes. Multiple agents can fill the same role.
agent_roles:
  - id: strategist
    display: Strategist
    color: "#FFB020"
    description: Niche validation, topic selection, format pattern recognition.
  - id: researcher
    display: Researcher
    color: "#5AC8FA"
    description: Source ingestion (NTSB, AAIB, archives), fact-check, timeline reconstruction.
  - id: script_producer
    display: Script Producer
    color: "#FF7A59"
    description: Cold-open through close, evidence-first cadence.
  - id: editor
    display: Editor
    color: "#FF5C8A"
    description: Cut assembly, VO timing, overlay placement.
  - id: publisher
    display: Publisher
    color: "#A0A0A0"
    description: Title/thumb finalize, schedule, post-publish CTR/APV watch.
  - id: substrate
    display: Substrate
    color: "#3A3A3A"
    description: Postgres adapter, Neo4j wrapper, Gap-Finder. Owned by Eric's Claude.

# The 10-stage pipeline. Each stage maps to a Notion SOP page.
stages:
  - id: "01"
    name: Niche Selection
    owner_role: strategist
    gate_owner: operator
    inputs: [market_signals, rpm_estimate]
    outputs: [validated_niche]
    tools: [gemini, perplexity, vidiq]
    gate_criteria:
      - RPM estimate ≥ $7
      - Rising/flat trend (not declining)
      - < 50 faceless-format competitors
      - Niche depth ≥ 50-video runway
    sop: sops/01-niche-selection.md

  - id: "02"
    name: Topic Loop
    owner_role: strategist
    gate_owner: operator
    inputs: [validated_niche, corpus_winning_patterns]
    outputs: [ranked_topic_list]
    tools: [gemini, neo4j_wrapper, vidiq]
    gate_criteria:
      - Google Trends pass
      - Format-match against ≥ 1 winning pattern in corpus
      - SEO anchor present (flight number, case ID, etc.)
    sop: sops/02-topic-loop.md

  - id: "03"
    name: Research + Source Pack
    owner_role: researcher
    gate_owner: operator
    inputs: [locked_topic]
    outputs: [source_pack, timeline_doc]
    tools: [gemini, archive_org, ntsb_docket, perplexity]
    gate_criteria:
      - Primary sources cited (NTSB/AAIB/TSB/BEA report)
      - Timeline reconstructed with timestamps
      - No single-source claims
    sop: sops/03-research.md

  - id: "04"
    name: Script
    owner_role: script_producer
    gate_owner: operator
    inputs: [source_pack, timeline_doc]
    outputs: [locked_script_11_to_18min]
    tools: [claude_opus, descript]
    gate_criteria:
      - Cold-open rhetorical hook
      - Evidence-first cadence (no verdict before evidence)
      - Sober tone — punchy packaging, neutral narration
    sop: sops/04-script.md

  - id: "05"
    name: Title + Thumb Concepting
    owner_role: publisher
    gate_owner: operator
    inputs: [locked_script]
    outputs: [3_title_variants, 3_thumb_concepts]
    tools: [nano_banana, higgsfield_soul, photoshop]
    gate_criteria:
      - All-caps hook + SEO anchor pattern
      - Thumb reads at 200px
      - A/B variant ready for post-publish swap
    sop: sops/05-title-thumb.md

  - id: "06"
    name: B-Roll + Asset Gen
    owner_role: editor
    gate_owner: operator
    inputs: [locked_script, asset_manifest]
    outputs: [bcoll_pack]
    tools: [higgsfield, archive_org, ntsb_docket, flight_sim, blender, remotion, storyblocks]
    gate_criteria:
      - Archival used where available (no AI-slop on forensic moments)
      - Character/aircraft consistency across shots
      - Copyright-clear (no Google Earth Studio commercial)
    sop: sops/06-broll.md

  - id: "07"
    name: VO
    owner_role: editor
    gate_owner: operator
    inputs: [locked_script]
    outputs: [vo_track]
    tools: [elevenlabs, cartesia]
    gate_criteria:
      - Consistent voice across episodes (locked ElevenLabs voice ID)
      - Pacing matches script blueprint
    sop: sops/07-vo.md

  - id: "08"
    name: Assembly
    owner_role: editor
    gate_owner: operator
    inputs: [vo_track, bcoll_pack, overlay_manifest]
    outputs: [rough_cut_v1]
    tools: [descript, remotion, premiere]
    gate_criteria:
      - Overlay manifest matches transcript timecodes
      - Underlord pass on filler/dead-air
      - Studio Sound applied to VO
    sop: sops/08-assembly.md

  - id: "09"
    name: Quality Gate + Publish
    owner_role: publisher
    gate_owner: operator
    inputs: [rough_cut_v2, title_thumb_locked]
    outputs: [published_video]
    tools: [youtube_studio, vidiq]
    gate_criteria:
      - Captions present and clean
      - End-screen + cards configured
      - Schedule slot confirmed
    sop: sops/09-publish.md

  - id: "10"
    name: Post-Publish Watch + Pattern Log
    owner_role: strategist
    gate_owner: operator
    inputs: [published_video, 72hr_metrics]
    outputs: [winning_pattern_or_kill]
    tools: [youtube_studio, neo4j_wrapper]
    gate_criteria:
      - CTR ≥ 10% AND APV ≥ 30% → log as Winning Pattern
      - Below threshold → kill or iterate, log learning
    sop: sops/10-watch.md

